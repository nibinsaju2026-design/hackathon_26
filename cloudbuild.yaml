steps:
  # Pull the previous image for caching (optional but recommended)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/marketplace:latest || exit 0']

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/marketplace:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/marketplace:latest',
      '--cache-from', 'gcr.io/$PROJECT_ID/marketplace:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/marketplace', '--all-tags']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'marketplace'
      - '--image'
      - 'gcr.io/$PROJECT_ID/marketplace:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--update-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,REDIS_URL=REDIS_URL:latest'
      - '--vpc-connector'
      - 'marketplace-connector'
      - '--set-cloudsql-instances'
      - '$_INSTANCE_CONNECTION_NAME'

images:
  - 'gcr.io/$PROJECT_ID/marketplace:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/marketplace:latest'

options:
  logging: CLOUD_LOGGING_ONLY
